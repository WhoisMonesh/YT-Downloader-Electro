appId: com.universal-media-downloader
productName: Universal Media Downloader
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/{__tests__,*.test.*,*.spec.*,test,tests}/**/*"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-keytar/**/*
  - node_modules/sharp/**/*
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "${productName}-${version}-setup.${ext}"
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Universal Media Downloader
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: "${productName}-${version}.${ext}"
  icon: resources/icon.icns
  category: public.app-category.entertainment
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  artifactName: "${productName}-${version}.${ext}"
  icon: resources
  category: AudioVideo
publish:
  provider: github
  owner: universal-media-downloader
  repo: universal-media-downloader
