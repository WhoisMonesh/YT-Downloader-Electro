<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4d0fb"/>
      <stop offset="1" stop-color="#74a8f7"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="0.5" stop-color="#a6e3a1"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="rgba(137,180,250,0.25)" stroke-width="2"/>

  <!-- Subtle glow circle -->
  <circle cx="256" cy="256" r="180" fill="rgba(137,180,250,0.06)"/>

  <!-- Download arrow -->
  <g transform="translate(256 256)">
    <path d="M 0 -120 L 0 60 M -70 -10 L 0 60 L 70 -10"
          fill="none" stroke="url(#accent)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tray (platform line at the bottom) -->
  <line x1="120" y1="360" x2="392" y2="360" stroke="url(#accent)" stroke-width="40" stroke-linecap="round"/>

  <!-- Equalizer / waveform on the right side -->
  <g stroke="url(#wave)" stroke-width="14" stroke-linecap="round">
    <line x1="60"  y1="120" x2="60"  y2="180"/>
    <line x1="96"  y1="100" x2="96"  y2="200"/>
    <line x1="132" y1="140" x2="132" y2="160"/>
  </g>
  <g stroke="url(#wave)" stroke-width="14" stroke-linecap="round">
    <line x1="380" y1="140" x2="380" y2="160"/>
    <line x1="416" y1="100" x2="416" y2="200"/>
    <line x1="452" y1="120" x2="452" y2="180"/>
  </g>
</svg>
